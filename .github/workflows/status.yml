name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies
        working-directory: ./open-chocolate
        run: npm ci

      - name: Run ESLint
        working-directory: ./open-chocolate
        run: npm run lint:check

      - name: Check formatting
        working-directory: ./open-chocolate
        run: npm run format:check

      - name: Run tests
        working-directory: ./open-chocolate
        run: npm test

      - name: Build project
        working-directory: ./open-chocolate
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: open-chocolate/dist

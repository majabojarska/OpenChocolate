[project]
name = "choco"
version = "0.1.0"
description = "M-Vave Chocolate Plus editor CLI + MIDI RE harness"
requires-python = ">=3.9"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# Default rule set (E4/E7/E9, F) plus the style/usability lints we use.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "PL",  # pylint subset (subprocess, etc.)
    "DTZ", # datetime timezone
    "FURB",# refurb (modern code quality)
]
ignore = [
    "PLR",   # too-many-* style lints (noisy)
    "PLC",   # pylint conventions
    "BLE001",# blind except is used intentionally at boundaries
]
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- chocolate bar, drawn in the style of the chocolate emoji -->
  <g transform="rotate(-6 32 32)">
    <rect x="9" y="15" width="46" height="34" rx="5" fill="#7c4a1f" stroke="#4a2b10" stroke-width="2"/>
    <!-- segments: 4 columns x 2 rows, grooves show the darker bar beneath -->
    <g fill="#a26f3a">
      <rect x="12" y="18" width="8.5" height="13" rx="1.5"/>
      <rect x="22.5" y="18" width="8.5" height="13" rx="1.5"/>
      <rect x="33" y="18" width="8.5" height="13" rx="1.5"/>
      <rect x="43.5" y="18" width="8.5" height="13" rx="1.5"/>
      <rect x="12" y="33" width="8.5" height="13" rx="1.5"/>
      <rect x="22.5" y="33" width="8.5" height="13" rx="1.5"/>
      <rect x="33" y="33" width="8.5" height="13" rx="1.5"/>
      <rect x="43.5" y="33" width="8.5" height="13" rx="1.5"/>
    </g>
    <!-- top-left bevel on each segment for a moulded-chocolate look -->
    <g fill="#b8824a">
      <rect x="13" y="19" width="6.5" height="3" rx="1"/>
      <rect x="23.5" y="19" width="6.5" height="3" rx="1"/>
      <rect x="34" y="19" width="6.5" height="3" rx="1"/>
      <rect x="44.5" y="19" width="6.5" height="3" rx="1"/>
      <rect x="13" y="34" width="6.5" height="3" rx="1"/>
      <rect x="23.5" y="34" width="6.5" height="3" rx="1"/>
      <rect x="34" y="34" width="6.5" height="3" rx="1"/>
      <rect x="44.5" y="34" width="6.5" height="3" rx="1"/>
    </g>
    <!-- small gloss -->
    <circle cx="16.5" cy="21" r="1.2" fill="#ffffff" opacity="0.55"/>
    <circle cx="47" cy="45" r="0.9" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
